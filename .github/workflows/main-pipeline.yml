name: Occacia CI/CD

on:
  push:
    branches: [ "main", "dev/*" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # -------------------------------------------------------
  # JOB 1: Backend — lint, type check, tests
  # -------------------------------------------------------
  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # matches backend/Dockerfile exactly
          cache: 'pip'

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install --user "poetry==2.3.2"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root --no-ansi

      - name: Lint (ruff)
        run: poetry run ruff check . --select E9,F63,F7,F82

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            poetry run pytest --tb=short -q
          else
            echo "No tests directory found, skipping"
          fi

  # -------------------------------------------------------
  # JOB 2: Frontend — install, type check, build
  # -------------------------------------------------------
  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # -------------------------------------------------------
  # JOB 3: Security scanning — runs after both pass
  # -------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ backend, frontend ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Python security scan (Bandit)
        run: |
          pip install bandit
          bandit -r backend/ -x backend/tests \
            --severity-level medium \
            --skip B104 \
            -f txt

      - name: Build image for container scan
        run: docker build -t occacia-scan ./backend

      - name: Container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: occacia-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # -------------------------------------------------------
  # JOB 4: Deploy to production — main branch only
  # -------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Ship files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/,frontend/,docker-compose.yml,nginx.conf"
          target: "~/occacia-app"

      - name: Deploy and migrate
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          LANGFLOW_URL: ${{ secrets.LANGFLOW_URL }}
          LANGFLOW_TOKEN: ${{ secrets.LANGFLOW_TOKEN }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PASSWORD,DATABASE_URL,SECRET_KEY,ALGORITHM,SENDGRID_API_KEY,FROM_EMAIL,LANGFLOW_URL,LANGFLOW_TOKEN
          script: |
            set -e
            cd ~/occacia-app

            # Write full production .env
            cat <<EOF > .env
            DATABASE_URL=${DATABASE_URL}
            DB_PASSWORD=${DB_PASSWORD}
            SECRET_KEY=${SECRET_KEY}
            ALGORITHM=${ALGORITHM:-HS256}
            SENDGRID_API_KEY=${SENDGRID_API_KEY}
            FROM_EMAIL=${FROM_EMAIL}
            LANGFLOW_URL=${LANGFLOW_URL}
            LANGFLOW_TOKEN=${LANGFLOW_TOKEN}
            REDIS_URL=redis://redis:6379
            EOF

            # Restart containers
            sudo docker compose down --remove-orphans || true
            sudo docker compose up --build -d

            # Wait for backend to be healthy
            echo "Waiting for backend..."
            for i in $(seq 1 15); do
              if sudo docker compose exec -T backend curl -sf http://localhost:8000/api/v1/health > /dev/null; then
                echo "Backend is up"
                break
              fi
              echo "Attempt $i/15..."
              sleep 4
            done

            # Run migrations
            sudo docker compose exec -T backend alembic upgrade head

            # Cleanup old images
            sudo docker image prune -f

            echo "Deployed at $(date)" >> ~/occacia-app/deploy_history.log