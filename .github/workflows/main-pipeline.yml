name: Occacia CI/CD

on:
  push:
    branches: [ "main", "dev/*" ]
  pull_request:
    branches: [ "main" ]

# Prevents overlapping deployments from corrupting your server
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --- Backend Quality Gate ---
  backend:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install --user "poetry==2.3.2"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root --no-ansi

      - name: Lint code
        run: poetry run ruff check . --select E9,F63,F7,F82

      - name: Run tests
        run: |
          if [ -d "tests" ]; then
            poetry run pytest --tb=short -q
          else
            echo "No tests directory found, skipping"
          fi

  # --- Frontend Build Check ---
  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # --- Security Audit ---
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Setup Python for Bandit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python security scan
        run: |
          pip install bandit
          bandit -r backend/ -x backend/tests --severity-level medium --skip B104 -f txt

      - name: Build image for container scan
        run: docker build -t occacia-scan ./backend

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: occacia-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # --- Deploy to Production ---
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Clean app code on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/occacia-app
            rm -rf \
              ~/occacia-app/backend \
              ~/occacia-app/frontend \
              ~/occacia-app/docker-compose.yml \
              ~/occacia-app/nginx.conf \
              ~/occacia-app/nginx.http.conf \
              ~/occacia-app/nginx.https.conf \
              ~/occacia-app/nginx-start.sh

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/,frontend/,docker-compose.yml,nginx.http.conf,nginx.https.conf,nginx-start.sh"
          target: "~/occacia-app"

      - name: Deploy and migrate
        uses: appleboy/ssh-action@v1.0.3
        env:
          LANGFLOW_URL: ${{ secrets.LANGFLOW_URL }}
          LANGFLOW_ORG_ID: ${{ secrets.LANGFLOW_ORG_ID }}
          LANGFLOW_TOKEN: ${{ secrets.LANGFLOW_TOKEN }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DISABLE_ADMIN_REGISTER: ${{ secrets.DISABLE_ADMIN_REGISTER }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LANGFLOW_URL,LANGFLOW_ORG_ID,LANGFLOW_TOKEN,DB_USER,DB_PASSWORD,DB_NAME,DATABASE_URL,SECRET_KEY,ALGORITHM,SENDGRID_API_KEY,FROM_EMAIL,REDIS_PASSWORD,DISABLE_ADMIN_REGISTER
          script: |
            set -e
            cd ~/occacia-app

            # Write .env file
            cat <<'EOF' > .env
            LANGFLOW_URL=${LANGFLOW_URL}
            LANGFLOW_ORG_ID=${LANGFLOW_ORG_ID}
            LANGFLOW_TOKEN=${LANGFLOW_TOKEN}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_NAME=${DB_NAME}
            DATABASE_URL=${DATABASE_URL}
            SECRET_KEY=${SECRET_KEY}
            ALGORITHM=${ALGORITHM:-HS256}
            SENDGRID_API_KEY=${SENDGRID_API_KEY}
            FROM_EMAIL=${FROM_EMAIL}
            REDIS_PASSWORD=${REDIS_PASSWORD}
            REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
            DISABLE_ADMIN_REGISTER=${DISABLE_ADMIN_REGISTER}
            DOCKER_SOCKET=/var/run/docker.sock
            EOF

            # Recreate containers while preserving named volumes.
            sudo docker compose down --remove-orphans || true
            sudo docker rm -f occacia-radar || true
            sudo docker rm -f \
              occacia-db \
              occacia-redis \
              occacia-backend \
              occacia-frontend \
              occacia-nginx \
              occacia-backup \
              occacia-radar || true
            sudo docker compose build --no-cache backend
            sudo docker compose up -d db redis backend

            echo "Waiting for backend health..."
            backend_healthy=0
            for i in $(seq 1 30); do
              status="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' occacia-backend 2>/dev/null || echo missing)"
              echo "Backend status: ${status} (${i}/30)"

              if [ "${status}" = "healthy" ]; then
                backend_healthy=1
                break
              fi

              if [ "${status}" = "unhealthy" ] || [ "${status}" = "exited" ] || [ "${status}" = "dead" ] || [ "${status}" = "missing" ]; then
                echo "Backend failed to become healthy. Recent logs:"
                sudo docker compose logs --tail=200 backend db redis
                exit 1
              fi

              sleep 4
            done

            if [ "${backend_healthy}" -ne 1 ]; then
              echo "Backend did not become healthy within the expected time. Recent logs:"
              sudo docker compose logs --tail=200 backend db redis
              exit 1
            fi

            sudo docker compose up -d frontend nginx db-backup portainer

            echo "Checking edge service..."
            if ! sudo docker compose ps; then
              echo "Unable to inspect compose services."
            fi

            if ! curl -I --max-time 10 http://localhost >/dev/null 2>&1; then
              echo "Nginx is not serving traffic on localhost. Recent logs:"
              sudo docker compose logs --tail=200 nginx frontend backend
              exit 1
            fi

            # Cleanup images
            sudo docker image prune -f
            echo "Deployed at $(date)" >> ~/occacia-app/deploy_history.log
