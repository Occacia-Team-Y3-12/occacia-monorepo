[project]
name = "occacia-backend"
version = "0.1.0"
description = "Occacia Backend Repository"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
  { name = "Dilruk Jayasinghe", email = "dilrukjayasinghe25@outlook.com" },
  { name = "Tharindu Kashmika", email = "kashmikat@gmail.com" },
]
dependencies = [
  "cryptography>=46.0.5",
  "fastapi>=0.128.5,<1.0.0",
  "uvicorn[standard]>=0.40.0,<1.0.0",
  "sqlalchemy>=2.0.45,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "psycopg2-binary>=2.9.11,<3.0.0",
  "pydantic[email]>=2.12.5,<3.0.0",
  "pydantic-settings>=2.12.0,<3.0.0",
  "python-dotenv>=1.2.1,<2.0.0",
  "pyjwt>=2.12.0",
  "argon2-cffi>=23.1.0",
  "python-multipart>=0.0.21,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "tenacity>=9.1.2,<10.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "tzdata",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"
ruff = "^0.9.0"
pip-audit = "^2.7.0"

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I", "UP", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio",
    "ignore:asyncio.iscoroutinefunction.*:DeprecationWarning",
    "ignore:asyncio.get_event_loop_policy.*:DeprecationWarning",
    "ignore:asyncio.set_event_loop_policy.*:DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
