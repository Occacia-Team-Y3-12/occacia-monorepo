[project]
name = "occacia-backend"
version = "0.1.0"
description = "Occacia Backend Repository"
readme = "README.md"
requires-python = ">=3.14,<4.0"
authors = [{ name = "Dilruk Jayasinghe", email = "dilrukjayasinghe25@outlook.com" }]
dependencies = [
  "fastapi>=0.128.5,<1.0.0",
  "uvicorn[standard]>=0.40.0,<1.0.0",
  "sqlalchemy>=2.0.45,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "psycopg2-binary>=2.9.11,<3.0.0",
  "pydantic>=2.12.5,<3.0.0",
  "pydantic-settings>=2.12.0,<3.0.0",
  "python-dotenv>=1.2.1,<2.0.0",
  "pyjwt[crypto]>=2.8.0,<3.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "email-validator>=2.3.0,<3.0.0",
  "python-multipart>=0.0.21,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "tenacity>=9.1.2,<10.0.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
pip-audit = "*"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
