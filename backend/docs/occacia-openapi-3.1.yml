    Core flow: Event -> Tasks -> Recommendations -> Packages -> Confirm Package ->
    Package Order -> Vendor Fulfillment Requests -> Task execution.


    Update 1.1.0: Added event scheduling (recurrence), reminders, and external calendar
    integration endpoints (UC-13).


    Update 1.1.1: Added customer/vendor inquiry read endpoints, package deletion,
    package order cancellation, and vendor fulfillment request detail endpoint.


    Update 1.1.2: Updated customer/vendor forgot-password flow to email OTP
    verification with resend OTP support before password reset.


    Update 1.1.3: Aligned all paths with actual router implementations. Added admin
