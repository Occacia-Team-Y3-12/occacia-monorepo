    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PackageId:
      name: packageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PackageOrderId:
      name: packageOrderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PersonaId:
      name: personaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    OrgId:
