components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PackageId:
      name: packageId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PackageOrderId:
      name: packageOrderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    PersonaId:
      name: personaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    OfferingId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    FulfillmentRequestId:
      name: fulfillmentRequestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
  responses:
    BadRequest:
      description: Bad request / validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UUID:
      type: string
      format: uuid
    ISODateTime:
      type: string
      format: date-time
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
    MessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    VersionResponse:
      type: object
      required:
      - version
      properties:
        version:
          type: string
        commit:
          type: string
        builtAt:
          $ref: '#/components/schemas/ISODateTime'
    UserRole:
      type: string
      enum:
      - CUSTOMER
      - VENDOR
      - ADMIN
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - PENDING
      - SUSPENDED
      - DISABLED
    VendorApprovalStatus:
      type: string
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    OrganizationStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
    EventStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
    TaskStatus:
      type: string
      enum:
      - DRAFT
      - PENDING
      - ASSIGNED
      - IN_PROGRESS
      - DONE
      - REJECTED
      - EXPIRED
    PackageType:
      type: string
      enum:
      - BUDGET
      - RECOMMENDED
      - HIGH_QUALITY
      - CUSTOM
    PackageOrderStatus:
      type: string
      enum:
      - CREATED
      - COMPLETED
      - CANCELLED_ADMIN
    FulfillmentRequestStatus:
      type: string
      enum:
      - SENT
      - ACCEPTED
      - REJECTED
      - EXPIRED
    ChatSender:
      type: string
      enum:
      - CUSTOMER
      - AI
    SupportActionType:
      type: string
      enum:
      - NOTE_ONLY
      - REASSIGN_VENDOR
      - UNASSIGN_VENDOR
      - UNLOCK_EDITING
      - EXTEND_EXPIRY
      - OVERRIDE_STATUS
      - ESCALATE
    InquiryCreatorRole:
      type: string
      enum:
      - CUSTOMER
      - VENDOR
    InquiryStatus:
      type: string
      enum:
      - OPEN
      - IN_PROGRESS
      - RESOLVED
    AdminOTPVerifyRequest:
      type: object
      required:
      - email
      - otp
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          minLength: 6
          maxLength: 6
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    CustomerRegisterRequest:
      type: object
      required:
      - fullName
      - email
      - password
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
        locale:
          type: string
    VendorRegisterRequest:
      type: object
      required:
      - email
      - password
      - displayName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        contactPhone:
          type: string
        organizationCode:
          type: string
          description: If joining existing organization
        organization:
