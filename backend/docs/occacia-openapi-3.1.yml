openapi: 3.1.0
info:
  title: Occacia API
  version: 1.1.0
  description: 'Occacia API contract aligned with use cases, EERD, and class diagram.
    Core flow: Event -> Tasks -> Recommendations -> Packages -> Confirm Package ->
    Package Order -> Vendor Fulfillment Requests -> Task execution.


    Updated on 2026-03-11: added optional endpoints to align with expanded API inventory
    (~112 operations) and switched Admin task support update from PATCH to PUT.'
servers:
- url: https://app.occacia.com/api/v1
  description: Production (example)
- url: http://localhost:3000/api/v1
  description: Local dev (example)
security:
- bearerAuth: []
tags:
- name: Authentication
- name: User Profile
- name: Customer
- name: Vendor
- name: Admin
- name: Support & Inquiries
- name: Metadata
- name: System & Ops
paths:
  /auth/customer/register:
    post:
      tags:
      - Authentication
      summary: Register customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequest'
      responses:
        '201':
          description: Registered (customer created as PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/customer/verify-email:
    get:
      tags:
      - Authentication
      summary: Verify customer email
      security: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Email verified; customer becomes ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/customer/email-verification/resend:
    post:
      tags:
      - Authentication
      summary: Resend customer verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Verification email resent (if account is pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/customer/login:
    post:
      tags:
      - Authentication
      summary: Customer login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in (tokens issued)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/customer/logout:
    post:
      tags:
      - Authentication
      summary: Customer logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/customer/token/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh customer access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/customer/password/change:
    post:
      tags:
      - Authentication
      summary: Change customer password (authenticated)
      description: Authenticated password change only (currentPassword + newPassword).
        Use the /password/forgot and /password/reset flow for forgotten passwords.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/customer/password/forgot:
    post:
      tags:
      - Authentication
      summary: Request customer password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset email requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/customer/password/reset:
    post:
      tags:
      - Authentication
      summary: Reset customer password using token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/vendor/register:
    post:
      tags:
      - Authentication
      summary: Register vendor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequest'
      responses:
        '201':
          description: Registered (vendor created as PENDING verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/vendor/verify-email:
    get:
      tags:
      - Authentication
      summary: Verify vendor email
      security: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Email verified; vendor becomes PENDING admin approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/vendor/email-verification/resend:
    post:
      tags:
      - Authentication
      summary: Resend vendor verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Verification email resent (if account is pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/vendor/login:
    post:
      tags:
      - Authentication
      summary: Vendor login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in (tokens issued)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/vendor/logout:
    post:
      tags:
      - Authentication
      summary: Vendor logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/vendor/token/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh vendor access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/vendor/password/change:
    post:
      tags:
      - Authentication
      summary: Change vendor password (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      description: Authenticated password change only (currentPassword + newPassword).
        Use the /password/forgot and /password/reset flow for forgotten passwords.
  /auth/vendor/password/forgot:
    post:
      tags:
      - Authentication
      summary: Request vendor password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Password reset email requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/vendor/password/reset:
    post:
      tags:
      - Authentication
      summary: Reset vendor password using token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/admin/register:
    post:
      tags:
      - Authentication
      summary: Provision admin account (internal)
      description: Restricted/internal endpoint; not self-service.
      responses:
        '201':
          description: Admin provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/admin/login:
    post:
      tags:
      - Authentication
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in (tokens issued)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/admin/logout:
    post:
      tags:
      - Authentication
      summary: Admin logout
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/admin/token/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh admin access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customers/me:
    get:
      tags:
      - User Profile
      summary: Get current customer profile
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
    put:
      tags:
      - User Profile
      summary: Update current customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
  /vendors/me:
    get:
      tags:
      - User Profile
      summary: Get current vendor profile
      responses:
        '200':
          description: Vendor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfile'
    put:
      tags:
      - User Profile
      summary: Update current vendor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfile'
  /admin/me:
    get:
      tags:
      - User Profile
      summary: Get current admin profile
      responses:
        '200':
          description: Admin profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
  /admin/vendors:
    get:
      tags:
      - Admin
      summary: List vendors (management)
      parameters:
      - name: approval_status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/VendorApprovalStatus'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AccountStatus'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Vendors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVendors'
  /admin/vendors/{vendorId}:
    parameters:
    - $ref: '#/components/parameters/VendorId'
    get:
      tags:
      - Admin
      summary: Get vendor detail (management)
      responses:
        '200':
          description: Vendor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorAdminView'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/vendors/{vendorId}/status:
    parameters:
    - $ref: '#/components/parameters/VendorId'
    put:
      tags:
      - Admin
      summary: Update vendor account status (ACTIVE/SUSPENDED/DISABLED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorStatusUpdateRequest'
      responses:
        '200':
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorAdminView'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/vendors/{vendorId}/approve:
    parameters:
    - $ref: '#/components/parameters/VendorId'
    post:
      tags:
      - Admin
      summary: Approve vendor registration
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorAdminView'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/vendors/{vendorId}/reject:
    parameters:
    - $ref: '#/components/parameters/VendorId'
    post:
      tags:
      - Admin
      summary: Reject vendor registration
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRejectRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorAdminView'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/customers:
    get:
      tags:
      - Admin
      summary: List customers (management)
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AccountStatus'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomers'
  /admin/customers/{customerId}:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    get:
      tags:
      - Admin
      summary: Get customer detail (management)
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAdminView'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/customers/{customerId}/status:
    parameters:
    - $ref: '#/components/parameters/CustomerId'
    put:
      tags:
      - Admin
      summary: Update customer account status (ACTIVE/SUSPENDED/DISABLED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerStatusUpdateRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAdminView'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/organizations:
    get:
      tags:
      - Admin
      summary: List organizations (management)
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrganizationStatus'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizations'
  /admin/organizations/{orgId}:
    parameters:
    - $ref: '#/components/parameters/OrgId'
    get:
      tags:
      - Admin
      summary: Get organization detail (management)
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/organizations/{orgId}/status:
    parameters:
    - $ref: '#/components/parameters/OrgId'
    put:
      tags:
      - Admin
      summary: Update organization status (ACTIVE/INACTIVE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationStatusUpdateRequest'
      responses:
        '200':
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
  /customers/inquiries:
    post:
      tags:
      - Support & Inquiries
      summary: Create customer inquiry (UC-30)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
      responses:
        '201':
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
    get:
      tags:
      - Support & Inquiries
      summary: List customer inquiries (optional)
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/InquiryStatus'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInquiries'
  /vendors/inquiries:
    post:
      tags:
      - Support & Inquiries
      summary: Create vendor inquiry (UC-30)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryCreateRequest'
      responses:
        '201':
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
    get:
      tags:
      - Support & Inquiries
      summary: List vendor inquiries (optional)
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/InquiryStatus'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInquiries'
  /admin/inquiries:
    get:
      tags:
      - Admin
      summary: List inquiries (UC-30)
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/InquiryStatus'
      - name: creatorRole
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/InquiryCreatorRole'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInquiries'
  /admin/inquiries/{inquiryId}:
    parameters:
    - $ref: '#/components/parameters/InquiryId'
    get:
      tags:
      - Admin
      summary: Get inquiry
      responses:
        '200':
          description: Inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Admin
      summary: Update inquiry (reply / status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryUpdateRequest'
      responses:
        '200':
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
  /admin/internal-notes:
    get:
      tags:
      - Admin
      summary: List internal notes (UC-28)
      parameters:
      - name: eventId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      - name: taskId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      - name: vendorId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      - name: packageOrderId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Internal notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInternalNotes'
    post:
      tags:
      - Admin
      summary: Create internal note (UC-28)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalNoteCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalNote'
        '400':
          $ref: '#/components/responses/BadRequest'
  /customers/personas:
    get:
      tags:
      - Customer
      summary: List personas
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Personas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPersonas'
    post:
      tags:
      - Customer
      summary: Create persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaCreateRequest'
      responses:
        '201':
          description: Created persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
  /customers/personas/{personaId}:
    parameters:
    - $ref: '#/components/parameters/PersonaId'
    get:
      tags:
      - Customer
      summary: Get persona
      responses:
        '200':
          description: Persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Customer
      summary: Update persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaUpdateRequest'
      responses:
        '200':
          description: Updated persona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
    delete:
      tags:
      - Customer
      summary: Delete persona
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/events:
    get:
      tags:
      - Customer
      summary: List events
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EventStatus'
