      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    FulfillmentRequestId:
      name: fulfillmentRequestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
  responses:
    BadRequest:
      description: Bad request / validation error
      content:
