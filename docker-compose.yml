x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===========================
  # 🧠 DATABASE (The Ledger)
  # ===========================
  db:
    image: postgres:15-alpine
    container_name: occacia-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ===========================
  # ⚙️ BACKEND API (The Engine)
  # ===========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: occacia-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Use internal service name 'db' for container-to-container networking
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      LANGFLOW_URL: ${LANGFLOW_URL}
      LANGFLOW_TOKEN: ${LANGFLOW_TOKEN}
      LANGFLOW_ORG_ID: ${LANGFLOW_ORG_ID}
    volumes:
      - ./backend:/app # Hot-reloading for development
      # Avoid mounting .venv from host to prevent overriding the container's build
      - /app/.venv
    logging: *default-logging

  # ===========================
  # 🌐 FRONTEND (The Face)
  # ===========================
  frontend:
    build: ./frontend
    container_name: occacia-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    logging: *default-logging

  # ===========================
  # 🚦 NGINX (The Traffic Cop)
  # ===========================
  nginx:
    image: nginx:alpine
    container_name: occacia-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt/:ro
    depends_on:
      - frontend
      - backend
    logging: *default-logging

  # ===========================
  # 📡 PORTAINER (The Radar)
  # ===========================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: occacia-radar
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - ${DOCKER_SOCKET}:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  portainer_data:
